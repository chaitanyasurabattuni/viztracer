# Publish a GitHub release to PyPI. The test matrix and the wheel pipeline run
# in this same workflow run; only the "dist" artifact they produced (the sdist
# and the wheels that passed their tests) is published, with PyPI trusted
# publishing. Configure a trusted publisher for this repository, workflow
# (release.yml) and environment (pypi) on PyPI before the first release.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/python-package.yml

  wheels:
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: [tests, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/viztracer/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check the release set matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_dist.py verify dist --expect-version "${TAG#v}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist/
