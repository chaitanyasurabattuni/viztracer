# Build a wheel, install it into prepared environments and run the test suite
# against it. Make "tests passed" the only required status check: it fails
# unless every leg of the matrix passed. Coverage is measured in a separate
# job and can never fail the workflow.

name: build

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefixed, because github.workflow is the caller's name when reused
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.2"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        exclude:
          - python-version: '3.10'
            os: windows-11-arm
          - python-version: '3.11'
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        # Test the PR head instead of the merge commit
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Allow ptrace for the attach tests
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb
        echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
    - name: Build the wheel
      run: |
        python -m pip install "uv==${UV_VERSION}"
        python -m uv build --wheel --no-config --python "$(python -c 'import sys; print(sys.executable)')" \
          --build-constraint tools/requirements/build-backend.txt --out-dir dist .
    - name: Prepare test environments
      run: python tools/test_matrix.py prepare --wheel dist/*.whl --root "$RUNNER_TEMP/vt"
    - name: Run the test suite (offline, no installs)
      run: python tools/test_matrix.py run --root "$RUNNER_TEMP/vt" --results-dir test-results
    - name: Upload test logs
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: test-results/
        retention-days: 7
    - name: Upload test results to Codecov
      if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        report_type: test_results
        directory: test-results
        flags: ${{ matrix.os }}-${{ matrix.python-version }}
        name: VizTracer Tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  coverage:
    # Best effort: every step may fail without failing the job or the workflow
    name: coverage (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Measure coverage
      continue-on-error: true
      run: |
        python -m pip install "uv==${UV_VERSION}"
        python -m uv build --wheel --no-config --python "$(python -c 'import sys; print(sys.executable)')" \
          --build-constraint tools/requirements/build-backend.txt --out-dir dist .
        python tools/test_matrix.py prepare --wheel dist/*.whl --root "$RUNNER_TEMP/vt" --envs full
        python tools/test_matrix.py run --root "$RUNNER_TEMP/vt" --results-dir coverage-results --coverage
    - name: Upload coverage reports to Codecov
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        directory: coverage-results
        flags: ${{ matrix.os }}-${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  tests-passed:
    # The single required check for the test matrix
    name: tests passed
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
    - name: Check the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix result: $RESULT"
        test "$RESULT" = success
